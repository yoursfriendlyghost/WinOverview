[package]
name = "winoverview"
version = "2.2.2"
edition = "2021"
description = "A minimal virtual desktop overview for Windows 11"
license = "MIT"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "compat-1-2", "raw-window-handle-06"] }
raw-window-handle = "0.6"
# Virtual desktops (same code as VirtualDesktopAccessor.dll, by the same author) - no DLL needed
winvd = "0.0.49"
global-hotkey = "0.10"
tray-icon = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Same version winvd uses, so window handles are the same type
[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Graphics_Imaging",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
slint-build = "1.18"
winresource = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[patch.crates-io]
winvd = { path = "crates/winvd" }
